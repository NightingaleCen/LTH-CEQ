name: Deploy LTH-CEQ

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # Frontend Deployment
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Project
        working-directory: ./web
        run: npm run build

      - name: Deploy Web (Dist only)
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: 32384

          SOURCE: "web/dist/"
          TARGET: "/var/www/ceq.nightingalecen.me/html/"
          ARGS: "-rltgoDzvO --delete"

      # ==========================================
      # Scraper Deployment
      # ==========================================
      - name: Deploy Scraper Code
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: 32384

          SOURCE: "scraper/"
          TARGET: "/var/www/ceq.nightingalecen.me/scraper/"
          EXCLUDE: ".venv/, __pycache__/, output/, .git/"
          ARGS: "-rltgoDzvO --delete"

      # ==========================================
      # Post-Deploy
      # ==========================================
      - name: Update Python Env on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 32384
          script: |
            cd /var/www/ceq.nightingalecen.me/scraper

            $HOME/.local/bin/uv sync

            # run scraper once
            $HOME/.local/bin/uv run scraper.py
